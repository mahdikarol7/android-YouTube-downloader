name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install buildozer
      run: pip install buildozer
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
    - name: Accept Android SDK licenses
      run: |
        yes | sudo /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses
    - name: Install Android SDK components
      run: |
        /home/runner/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "platform-tools" "platforms;android-34" "build-tools;35.0.0"
    - name: Build APK
      run: buildozer -v android debug
      working-directory: ./mobile_app
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeDownloader-APK
        path: mobile_app/bin/*.apk