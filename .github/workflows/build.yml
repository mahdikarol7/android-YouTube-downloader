name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Install buildozer
      run: pip install buildozer
    - name: Install system dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 cmake libffi-dev libssl-dev
    - name: Initialize buildozer (download SDK/NDK)
      run: |
        cd mobile_app
        buildozer -v android debug || true
      continue-on-error: true
    - name: Accept Android SDK licenses
      run: |
        yes | /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk --licenses
    - name: Install Android SDK components
      run: |
        /home/runner/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --sdk_root=/home/runner/.buildozer/android/platform/android-sdk "platform-tools" "platforms;android-34" "build-tools;34.0.0" "build-tools;35.0.0" "build-tools;33.0.2"
    - name: Verify build-tools and aidl
      run: |
        ls -la /home/runner/.buildozer/android/platform/android-sdk/build-tools/
        find /home/runner/.buildozer/android/platform/android-sdk -name "aidl" -type f 2>/dev/null
    - name: Build APK
      run: buildozer -v android debug
      working-directory: ./mobile_app
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: YouTubeDownloader-APK
        path: mobile_app/bin/*.apk